<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Digital HR</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/workspace.css">
</head>

<body>
  <div id="app-content" aria-live="polite">
    <div class="loading-page">
      <header class="topbar">
        <div class="brand">
          <span class="logo">D</span>
          <span>Digital HR</span>
        </div>

        <span class="topbar-note">Корпоративный портал</span>
      </header>

      <main class="loading-content">
        <div class="loading-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="4" y="10" width="16" height="11" rx="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            <path d="M12 14v3"></path>
          </svg>
        </div>

        <h1>Подождите немного</h1>
        <p class="subtitle">
          Подготавливаем рабочее пространство Digital HR
        </p>

        <div class="loader" role="status" aria-label="Загрузка"></div>
        <p class="loading-status">Проверяем авторизацию...</p>
      </main>

      <footer>
        Digital HR · Корпоративная информационная система
      </footer>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
