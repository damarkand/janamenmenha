<style>
    
:root {
  --hr-bg: #ffffff;
  --hr-sidebar: #f9faf9;
  --hr-surface: #ffffff;
  --hr-surface-hover: #f1f3f2;
  --hr-border: #e7e9e7;
  --hr-text: #202321;
  --hr-muted: #777e79;
  --hr-accent: #0d966f;
  --hr-accent-hover: #0b805f;
  --hr-accent-soft: #e9f6f0;
  --hr-radius: 12px;
  --hr-sidebar-width: 258px;
}

.hr-app,
.hr-app * {
  box-sizing: border-box;
}

.hr-app {
  display: flex;
  width: 100%;
  min-height: 100vh;
  color: var(--hr-text);
  background: var(--hr-bg);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

.hr-app button,
.hr-app a {
  font: inherit;
}

.hr-app button {
  color: inherit;
}

.hr-sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  width: var(--hr-sidebar-width);
  padding: 15px 12px 12px;
  background: var(--hr-sidebar);
  border-right: 1px solid var(--hr-border);
}

.hr-sidebar-top {
  min-height: 0;
  flex: 1;
}

.hr-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 42px;
  margin: 0 3px 26px;
  color: var(--hr-text);
  text-decoration: none;
}

.hr-brand-icon {
  display: grid;
  width: 31px;
  height: 31px;
  place-items: center;
  border-radius: 10px;
  color: white;
  background: var(--hr-accent);
  font-size: 23px;
  font-weight: 600;
  line-height: 1;
}

.hr-brand-name {
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -0.4px;
}

.hr-sidebar-label {
  padding: 0 10px;
  margin-bottom: 10px;
  color: var(--hr-muted);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.6px;
  text-transform: uppercase;
}

.hr-navigation {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.hr-nav-item,
.hr-notifications-button {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  min-height: 42px;
  padding: 0 11px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: #424843;
  text-align: left;
  cursor: pointer;
  transition: background 140ms ease, color 140ms ease;
}

.hr-nav-item:hover,
.hr-notifications-button:hover,
.hr-user-card:hover {
  background: var(--hr-surface-hover);
}

.hr-nav-item.is-active {
  color: var(--hr-text);
  background: #eceeec;
  font-weight: 600;
}

.hr-nav-icon,
.hr-nav-icon svg,
.hr-icon-button svg,
.hr-breadcrumb svg,
.hr-user-chevron,
.hr-topbar svg {
  display: block;
  width: 19px;
  height: 19px;
  flex: 0 0 auto;
}

.hr-nav-icon svg,
.hr-icon-button svg,
.hr-breadcrumb svg,
.hr-user-chevron,
.hr-topbar svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hr-nav-text {
  min-width: 0;
  flex: 1;
}

.hr-nav-badge,
.hr-notification-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 21px;
  height: 21px;
  padding: 0 6px;
  border-radius: 7px;
  background: #e5f4ed;
  color: #08764f;
  font-size: 11px;
  font-weight: 650;
}

.hr-sidebar-bottom {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--hr-border);
}

.hr-notifications-button {
  min-height: 40px;
}

.hr-notification-count[hidden] {
  display: none;
}

.hr-user-card {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-width: 0;
  padding: 9px 7px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.hr-avatar {
  display: grid;
  width: 35px;
  height: 35px;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid #cce7da;
  border-radius: 50%;
  background: var(--hr-accent-soft);
  color: #08764f;
  font-size: 12px;
  font-weight: 700;
}

.hr-user-meta {
  display: flex;
  min-width: 0;
  flex: 1;
  flex-direction: column;
  gap: 3px;
}

.hr-user-name,
.hr-user-role {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.hr-user-name {
  font-size: 12px;
  font-weight: 600;
}

.hr-user-role {
  color: var(--hr-muted);
  font-size: 11px;
}

.hr-user-chevron {
  width: 16px;
  height: 16px;
  color: var(--hr-muted);
}

.hr-main {
  display: flex;
  min-width: 0;
  min-height: 100vh;
  flex: 1;
  flex-direction: column;
  margin-left: var(--hr-sidebar-width);
}

.hr-topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 57px;
  padding: 0 30px;
  border-bottom: 1px solid var(--hr-border);
  background: rgb(255 255 255 / 94%);
  backdrop-filter: blur(12px);
}

.hr-logout-button:hover {
  background: #fff8f6;
  color: #974b3e;
}

.hr-topbar-left,
.hr-topbar-right,
.hr-breadcrumb {
  display: flex;
  align-items: center;
  gap: 11px;
}

.hr-breadcrumb {
  gap: 9px;
  color: var(--hr-muted);
  font-size: 12px;
}

.hr-breadcrumb svg {
  width: 14px;
  height: 14px;
}

.hr-breadcrumb strong {
  color: var(--hr-text);
  font-size: 12px;
  font-weight: 600;
}

.hr-connection-indicator {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--hr-muted);
  font-size: 11px;
}

.hr-connection-indicator span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--hr-accent);
}

.hr-icon-button {
  display: grid;
  width: 35px;
  height: 35px;
  place-items: center;
  border: 1px solid transparent;
  border-radius: 9px;
  background: transparent;
  color: #5b625d;
  cursor: pointer;
}

.hr-icon-button:hover {
  border-color: var(--hr-border);
  background: var(--hr-surface-hover);
}

.hr-mobile-menu,
.hr-mobile-close {
  display: none;
}

.hr-content {
  width: 100%;
  max-width: 1050px;
  margin: 0 auto;
  padding: 43px 48px 64px;
}

.hr-page-header {
  margin-bottom: 27px;
}

.hr-eyebrow {
  margin-bottom: 9px;
  color: var(--hr-accent);
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.7px;
  text-transform: uppercase;
}

.hr-page-title {
  margin: 0;
  color: var(--hr-text);
  font-size: clamp(25px, 3vw, 31px);
  font-weight: 650;
  letter-spacing: -1.1px;
  line-height: 1.25;
}

.hr-page-description {
  margin: 9px 0 0;
  color: var(--hr-muted);
  font-size: 13px;
  line-height: 1.6;
}

.hr-profile-hero {
  display: flex;
  align-items: center;
  gap: 19px;
  padding: 25px;
  border: 1px solid var(--hr-border);
  border-radius: 15px;
  background: #fff;
}

.hr-profile-avatar {
  display: grid;
  width: 75px;
  height: 75px;
  flex: 0 0 auto;
  place-items: center;
  border: 1px solid #cde9db;
  border-radius: 50%;
  background: var(--hr-accent-soft);
  color: #08764f;
  font-size: 22px;
  font-weight: 650;
}

.hr-profile-identity {
  min-width: 0;
  flex: 1;
}

.hr-profile-name {
  margin: 0;
  overflow-wrap: anywhere;
  font-size: 21px;
  font-weight: 650;
  letter-spacing: -0.5px;
}

.hr-profile-position {
  margin: 7px 0 0;
  color: var(--hr-muted);
  font-size: 13px;
  line-height: 1.5;
}

.hr-role-chip {
  display: inline-flex;
  align-items: center;
  width: fit-content;
  margin-top: 12px;
  padding: 5px 9px;
  border-radius: 7px;
  background: var(--hr-accent-soft);
  color: #08764f;
  font-size: 11px;
  font-weight: 600;
}

.hr-section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 29px 0 13px;
}

.hr-section-title {
  margin: 0;
  font-size: 14px;
  font-weight: 650;
  letter-spacing: -0.2px;
}

.hr-section-caption {
  color: var(--hr-muted);
  font-size: 11px;
}

.hr-info-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.hr-info-card {
  min-width: 0;
  padding: 17px 18px;
  border: 1px solid var(--hr-border);
  border-radius: 12px;
  background: var(--hr-surface);
}

.hr-info-label {
  display: block;
  margin-bottom: 9px;
  color: var(--hr-muted);
  font-size: 11px;
  font-weight: 500;
}

.hr-info-value {
  display: block;
  overflow-wrap: anywhere;
  color: var(--hr-text);
  font-size: 13px;
  font-weight: 550;
  line-height: 1.55;
}

.hr-info-hint {
  display: block;
  margin-top: 5px;
  color: var(--hr-muted);
  font-size: 11px;
  line-height: 1.5;
}

.hr-stats-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 12px;
}

.hr-stat-card {
  display: flex;
  align-items: flex-start;
  gap: 13px;
  padding: 18px;
  border: 1px solid var(--hr-border);
  border-radius: 12px;
}

.hr-stat-icon {
  display: grid;
  width: 36px;
  height: 36px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 10px;
  background: var(--hr-accent-soft);
  color: var(--hr-accent);
}

.hr-stat-icon svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hr-stat-value {
  display: block;
  margin-bottom: 5px;
  font-size: 22px;
  font-weight: 650;
  letter-spacing: -0.6px;
}

.hr-stat-label {
  color: var(--hr-muted);
  font-size: 11px;
  line-height: 1.5;
}

.hr-courses-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.hr-course-card {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 15px;
  border: 1px solid var(--hr-border);
  border-radius: 11px;
}

.hr-course-icon {
  display: grid;
  width: 39px;
  height: 39px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 10px;
  background: #f0f2f0;
  color: #535b55;
}

.hr-course-icon svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hr-course-details {
  min-width: 0;
  flex: 1;
}

.hr-course-title {
  margin: 0;
  overflow-wrap: anywhere;
  font-size: 12px;
  font-weight: 600;
}

.hr-course-description {
  margin: 5px 0 0;
  color: var(--hr-muted);
  font-size: 11px;
  line-height: 1.5;
}

.hr-empty-state {
  display: flex;
  align-items: center;
  flex-direction: column;
  padding: 48px 20px;
  border: 1px dashed #dfe4e0;
  border-radius: 13px;
  text-align: center;
}

.hr-empty-icon {
  display: grid;
  width: 45px;
  height: 45px;
  margin-bottom: 14px;
  place-items: center;
  border-radius: 13px;
  background: #f2f4f2;
  color: #69716b;
}

.hr-empty-icon svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hr-empty-title {
  margin: 0;
  font-size: 14px;
  font-weight: 650;
}

.hr-empty-description {
  max-width: 340px;
  margin: 8px 0 0;
  color: var(--hr-muted);
  font-size: 12px;
  line-height: 1.7;
}

.hr-retry-button {
  margin-top: 17px;
  padding: 9px 13px;
  border: 1px solid var(--hr-border);
  border-radius: 9px;
  background: white;
  font-size: 12px;
  cursor: pointer;
}

.hr-retry-button:hover {
  background: var(--hr-surface-hover);
}

.hr-page-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  min-height: 220px;
  color: var(--hr-muted);
  font-size: 12px;
}

.hr-spinner {
  width: 18px;
  height: 18px;
  border: 2px solid #e1e8e3;
  border-top-color: var(--hr-accent);
  border-radius: 50%;
  animation: hr-spin 700ms linear infinite;
}

@keyframes hr-spin {
  to {
    transform: rotate(360deg);
  }
}

.hr-error-message {
  padding: 13px 15px;
  border: 1px solid #f0d9d4;
  border-radius: 10px;
  background: #fff8f6;
  color: #974b3e;
  font-size: 12px;
  line-height: 1.6;
}

.hr-sidebar-overlay {
  display: none;
}

.hr-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
}

.hr-tabs {
  display: inline-flex;
  gap: 4px;
  padding: 4px;
  border: 1px solid var(--hr-border);
  border-radius: 11px;
  background: var(--hr-sidebar);
}

.hr-tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 32px;
  padding: 0 13px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--hr-muted);
  font-size: 12px;
  font-weight: 550;
  cursor: pointer;
  transition: background 140ms ease, color 140ms ease;
}

.hr-tab:hover {
  color: var(--hr-text);
}

.hr-tab.is-active {
  background: #fff;
  color: var(--hr-text);
  box-shadow: 0 0 0 1px var(--hr-border), 0 1px 2px rgb(20 25 21 / 6%);
}

.hr-toolbar-button {
  margin-top: 0;
}

.hr-retry-button:disabled {
  opacity: 0.5;
  cursor: default;
}

.hr-retry-button:disabled:hover {
  background: white;
}

.hr-notifications-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.hr-notification-item {
  display: flex;
  align-items: center;
  border: 1px solid var(--hr-border);
  border-radius: 11px;
  background: var(--hr-surface);
  transition: border-color 140ms ease;
}

.hr-notification-item.is-unread {
  border-color: #cde9db;
  background: #fbfdfc;
}

.hr-notification-main {
  display: flex;
  align-items: flex-start;
  gap: 13px;
  min-width: 0;
  flex: 1;
  padding: 15px;
  border: 0;
  border-radius: 11px;
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition: background 140ms ease;
}

.hr-notification-main:hover {
  background: var(--hr-surface-hover);
}

.hr-notification-icon {
  display: grid;
  width: 39px;
  height: 39px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 10px;
  background: #f0f2f0;
  color: #535b55;
}

.hr-notification-item.is-unread .hr-notification-icon {
  background: var(--hr-accent-soft);
  color: var(--hr-accent);
}

.hr-notification-icon svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hr-notification-content {
  display: block;
  min-width: 0;
  flex: 1;
}

.hr-notification-title {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
}

.hr-notification-title-text {
  min-width: 0;
  overflow-wrap: anywhere;
}

.hr-notification-dot {
  width: 7px;
  height: 7px;
  flex: 0 0 auto;
  margin-top: 5px;
  border-radius: 50%;
  background: var(--hr-accent);
}

.hr-notification-dot[hidden],
.hr-notification-read[hidden],
.hr-notification-message[hidden] {
  display: none;
}

.hr-notification-message {
  display: block;
  margin-top: 5px;
  color: var(--hr-muted);
  font-size: 11px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.hr-notification-time {
  display: block;
  margin-top: 8px;
  color: var(--hr-muted);
  font-size: 11px;
}

.hr-notification-read {
  margin-right: 12px;
}

.hr-app [hidden] {
  display: none !important;
}

.hr-page-header-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
}

.hr-app .hr-primary-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 38px;
  padding: 0 16px;
  border: 1px solid var(--hr-accent);
  border-radius: 9px;
  background: var(--hr-accent);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background 140ms ease;
}

.hr-app .hr-primary-button:hover {
  background: var(--hr-accent-hover);
}

.hr-app .hr-primary-button:disabled,
.hr-app .hr-secondary-button:disabled,
.hr-app .hr-danger-button:disabled {
  opacity: 0.55;
  cursor: default;
}

.hr-primary-button svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hr-app .hr-secondary-button,
.hr-app .hr-danger-button {
  min-height: 38px;
  padding: 0 15px;
  border: 1px solid var(--hr-border);
  border-radius: 9px;
  background: #fff;
  font-size: 12px;
  font-weight: 550;
  cursor: pointer;
}

.hr-app .hr-secondary-button:hover:not(:disabled) {
  background: var(--hr-surface-hover);
}

.hr-app .hr-danger-button {
  border-color: #f0d9d4;
  color: #974b3e;
}

.hr-app .hr-danger-button:hover:not(:disabled) {
  background: #fff8f6;
}

.hr-success-message {
  padding: 13px 15px;
  border: 1px solid #cde9db;
  border-radius: 10px;
  background: var(--hr-accent-soft);
  color: #08764f;
  font-size: 12px;
  line-height: 1.6;
}

.hr-error-message,
.hr-success-message {
  margin: 0 0 16px;
}

.hr-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.hr-input,
.hr-select,
.hr-textarea {
  display: block;
  width: 100%;
  min-height: 40px;
  padding: 0 12px;
  border: 1px solid var(--hr-border);
  border-radius: 9px;
  background: #fff;
  color: var(--hr-text);
  font: inherit;
  font-size: 13px;
  transition: border-color 140ms ease, box-shadow 140ms ease;
}

.hr-textarea {
  min-height: 84px;
  padding: 10px 12px;
  line-height: 1.5;
  resize: vertical;
}

.hr-input:focus,
.hr-select:focus,
.hr-textarea:focus {
  border-color: var(--hr-accent);
  outline: none;
  box-shadow: 0 0 0 3px rgb(13 150 111 / 9%);
}

.hr-filters .hr-select {
  width: auto;
  min-height: 34px;
  padding: 0 10px;
  font-size: 12px;
}

.hr-field {
  margin-bottom: 16px;
}

.hr-field-row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.hr-label {
  display: block;
  margin-bottom: 7px;
  font-size: 12px;
  font-weight: 550;
}

.hr-field-hint {
  margin-top: 6px;
  color: var(--hr-muted);
  font-size: 11px;
  line-height: 1.5;
}

.hr-status {
  display: inline-flex;
  align-items: center;
  flex: 0 0 auto;
  width: fit-content;
  padding: 4px 9px;
  border-radius: 7px;
  background: #f0f2f0;
  color: #535b55;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}

.hr-status.is-pending {
  background: #fff6e0;
  color: #8a5a00;
}
